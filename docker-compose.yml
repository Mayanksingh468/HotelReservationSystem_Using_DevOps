services:
  db:
    image: mysql:8.4
    container_name: hotel-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hotel_reservation
      MYSQL_USER: hotel_user
      MYSQL_PASSWORD: hotelpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel-reservation-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/hotel_reservation
      DB_USER: hotel_user
      DB_PASSWORD: hotelpassword
    command: ["sh", "-c", "java -cp app.jar DatabaseTest && tail -f /dev/null"]

volumes:
  mysql_data:
